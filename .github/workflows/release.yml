# Publishes the image to GHCR. Manual only, and only once the maintainer
# approves the first release: run it from the Actions tab on a tag like
# v3.10.5-p1 (Run workflow -> pick the tag). It never runs on push.
name: Release image (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to push the image to GHCR'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event.inputs.confirm == 'publish' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ytvictorworld/garceslab-anime
          tags: |
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
